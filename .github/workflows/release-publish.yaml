name: Flame Release Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish or recover
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: flame-release-publish-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

env:
  CLICOLOR_FORCE: 1
  IMAGE_REGISTRY: docker.io/xflops
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

jobs:
  release-metadata:
    name: Release Metadata
    runs-on: ubuntu-26.04
    outputs:
      cargo-version: ${{ steps.metadata.outputs.cargo-version }}
      docker-tag: ${{ steps.metadata.outputs.docker-tag }}
      python-version: ${{ steps.metadata.outputs.python-version }}
      source-sha: ${{ steps.metadata.outputs.source-sha }}
      stdng-version: ${{ steps.metadata.outputs.stdng-version }}
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}

      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          path: source

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Validate release metadata
        id: metadata
        working-directory: source
        run: ../hack/release.sh validate-metadata "${RELEASE_TAG}" "${GITHUB_OUTPUT}"

  publish-python:
    name: Publish flamepy
    runs-on: ubuntu-26.04
    needs: release-metadata
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}

      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-metadata.outputs.source-sha }}
          path: source

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Validate PyPI credentials
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: hack/release.sh validate-credentials pypi

      - name: Build and validate flamepy
        env:
          PYTHON_VERSION: ${{ needs.release-metadata.outputs.python-version }}
        working-directory: source
        run: ../hack/release.sh build-python "${PYTHON_VERSION}"

      - name: Publish flamepy to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: source/dist/flamepy
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      - name: Verify flamepy from PyPI
        env:
          PYTHON_VERSION: ${{ needs.release-metadata.outputs.python-version }}
        run: hack/release.sh verify-pypi "${PYTHON_VERSION}"

  publish-rust:
    name: Publish Rust crates
    runs-on: ubuntu-26.04
    needs: release-metadata
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      CARGO_VERSION: ${{ needs.release-metadata.outputs.cargo-version }}
      STDNG_VERSION: ${{ needs.release-metadata.outputs.stdng-version }}
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}

      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-metadata.outputs.source-sha }}
          path: source

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler pkg-config libssl-dev

      - name: Validate crates.io credentials
        run: hack/release.sh validate-credentials crates

      - name: Package and publish Rust crates
        working-directory: source
        run: ../hack/release.sh publish-rust "${CARGO_VERSION}" "${STDNG_VERSION}"

  # The release binaries: one tar.gz per architecture that `./sbin/flmadm install` installs from.
  # Built on 24.04 runners so the binaries run on the oldest glibc we support.
  publish-binaries:
    name: Publish ${{ matrix.arch }} binaries
    needs: release-metadata
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}

      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-metadata.outputs.source-sha }}
          path: source

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache-workspaces: source

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler pkg-config libssl-dev

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: 0.9.26

      - name: Build flmadm
        working-directory: source
        run: cargo build --release -p flmadm

      # flmadm package builds everything (it finds uv on PATH and bundles it) and writes, in dist/,
      # the package, flame-<tag>-linux-<arch>.tar.gz and flmadm-<tag>-linux-<arch>, each with a
      # .sha256 file.
      - name: Package binaries
        working-directory: source
        run: ./target/release/flmadm package --src-dir . --output "${RUNNER_TEMP}/dist" --tag "${RELEASE_TAG}"

      # Install the way a user does: the standalone flmadm, from the archive's URL.
      - name: Smoke test the release assets
        run: |
          dist="${RUNNER_TEMP}/dist"
          (cd "${dist}" && sha256sum -c ./*.sha256)
          (cd "${dist}" && python3 -m http.server 8000 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 2
          "${dist}/flmadm-${RELEASE_TAG}-linux-${{ matrix.arch }}" install \
            --package "http://127.0.0.1:8000/flame-${RELEASE_TAG}-linux-${{ matrix.arch }}.tar.gz" \
            --prefix "${RUNNER_TEMP}/flame" --all --no-systemd --python-version 3.12 --force
          "${RUNNER_TEMP}/flame/bin/flmctl" --version
          "${RUNNER_TEMP}/flame/bin/flame-session-manager" --version
          source "${RUNNER_TEMP}/flame/sbin/flmenv.sh" --python-version 3.12
          python3 -c "import flamepy"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${RELEASE_TAG}" "${RUNNER_TEMP}"/dist/flame-*.tar.gz* "${RUNNER_TEMP}"/dist/flmadm-* --repo "${GITHUB_REPOSITORY}" --clobber

  publish-images:
    name: Publish native images
    needs: release-metadata
    uses: ./.github/workflows/build-images.yaml
    with:
      source-sha: ${{ needs.release-metadata.outputs.source-sha }}
      image-tag: ${{ needs.release-metadata.outputs.docker-tag }}
    secrets: inherit
